---
- name: Test configuration variables export using a read-only mc fixture
  hosts: minio_cluster
  gather_facts: false
  vars:
    minio_configuration_mc_binary_path: "{{ playbook_dir }}/fake_mc.py"
    ansible_os_family: RedHat
    minio_configuration_alias: production
    minio_configuration_backets_delete: true
    minio_configuration_users_delete: true
    minio_configuration_export_path: "{{ playbook_dir }}/../../../.ansible/exported-inventory.yml"
  tasks:

    - name: Require explicit export selection for this test
      tags: always
      ansible.builtin.assert:
        that:
          - "'export' in ansible_run_tags"

    - name: Ensure local test artifact directory exists
      tags: always
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../../.ansible"
        state: directory
        mode: '0700'

    - name: Execute actual export tasks
      tags: always
      ansible.builtin.include_role:
        name: minio-configuration

    - name: Load exported configuration variables
      tags: always
      ansible.builtin.set_fact:
        exported: "{{ lookup('file', minio_configuration_export_path) | from_yaml }}"
        exported_yaml: "{{ lookup('file', minio_configuration_export_path) }}"

    - name: Verify the resulting inventory and file permissions
      tags: always
      ansible.builtin.stat:
        path: "{{ minio_configuration_export_path }}"
      register: exported_file

    - name: Assert exported configuration contents and field order
      tags: always
      ansible.builtin.assert:
        that:
          - exported_file.stat.mode == '0600'
          - exported.keys() | list == ['minio_configuration_users', 'minio_configuration_groups', 'minio_configuration_backets']
          - exported.minio_configuration_users[1].groups == ['staff']
          - exported.minio_configuration_users | length == 2
          - exported.minio_configuration_backets | length == 2
          - exported.minio_configuration_groups[0].status == 'disabled'
          - exported.minio_configuration_users[1].statements | length == 4
          - exported.minio_configuration_groups[0].statements | length == 2
          - exported.minio_configuration_users[1].keys() | list == ['name', 'status', 'groups', 'statements']
          - exported.minio_configuration_groups[0].keys() | list == ['name', 'members', 'status', 'statements']
          - exported.minio_configuration_backets[1].anonymous_policy.keys() | list == ['Version', 'Statement']
          - >-
            exported_yaml is search('(?m)^\s+Action: \[[^\n]*\]$')
          - >-
            exported_yaml is search('(?m)^\s+Resource: \[[^\n]*\]$')
          - exported.minio_configuration_backets[0].keys() | list == ['name', 'anonymous', 'versioning']
          - exported.minio_configuration_backets[1].keys() | list == ['name', 'anonymous_policy', 'versioning']
          - minio_configuration_effective_mode == 'export'
          - minio_configuration_existing_users_raw is not defined or minio_configuration_existing_users_raw is skipped
          - minio_configuration_existing_buckets_raw is not defined or minio_configuration_existing_buckets_raw is skipped
          - minio_configuration_policy_assignments is not defined or minio_configuration_policy_assignments is skipped

    - name: Require name to be the first field of every exported entity
      tags: always
      ansible.builtin.assert:
        that:
          - item.keys() | first == 'name'
      loop: "{{ exported.minio_configuration_users + exported.minio_configuration_groups + exported.minio_configuration_backets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require readable field order in user and group policy statements
      tags: always
      ansible.builtin.assert:
        that:
          - item.keys() | list == ['Sid', 'Effect', 'Action', 'Resource']
      loop: "{{ (exported.minio_configuration_users + exported.minio_configuration_groups) | map(attribute='statements') | flatten }}"
      loop_control:
        label: "{{ item.Sid }}"

    - name: Require readable field order in anonymous policy statements
      tags: always
      ansible.builtin.assert:
        that:
          - exported.minio_configuration_backets[1].anonymous_policy.Statement[0].keys() | list == ['Effect', 'Principal', 'Action', 'Resource']
