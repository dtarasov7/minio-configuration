---
- name: Verify bucket versioning transitions without bucket removal
  hosts: minio_cluster
  gather_facts: false
  vars:
    minio_configuration_mc_binary_path: "{{ playbook_dir }}/bucket_mc.py"
    minio_configuration_alias: production
    minio_configuration_users: []
    minio_configuration_groups: []
    initial_bucket_states:
      enabled-off: Enabled
      enabled-on: Enabled
      suspended-off: Suspended
      suspended-on: Suspended
      empty-off: ''
    minio_configuration_backets:
      - name: public
        versioning: false
      - name: private
        versioning: true
      - name: default-off
      - name: enabled-off
        versioning: false
      - name: enabled-on
        versioning: true
      - name: suspended-off
        versioning: false
      - name: suspended-on
        versioning: true
      - name: empty-off
        versioning: false
  tasks:

    - name: Prepare fixture log directory
      ansible.builtin.file:
        path: '{{ playbook_dir }}/../../../.ansible'
        state: directory
        mode: '0700'

    - name: Reset fixture command log
      ansible.builtin.copy:
        content: ''
        dest: "{{ playbook_dir }}/../../../.ansible/bucket-commands.jsonl"
        mode: '0600'
      check_mode: false

    - name: Seed existing buckets in all versioning states
      ansible.builtin.copy:
        content: '{{ initial_bucket_states | to_json }}'
        dest: '{{ playbook_dir }}/../../../.ansible/bucket-state.json'
        mode: '0600'
      check_mode: false

    - name: Apply an empty bucket list
      ansible.builtin.include_role:
        name: minio-configuration
        tasks_from: backet.yaml
      vars:
        minio_configuration_effective_backets: []

    - name: Configure declared buckets
      ansible.builtin.include_role:
        name: minio-configuration
        tasks_from: backet.yaml
      vars:
        minio_configuration_effective_backets: '{{ minio_configuration_backets }}'

    - name: Read recorded commands
      ansible.builtin.set_fact:
        bucket_commands: "{{ lookup('file', playbook_dir + '/../../../.ansible/bucket-commands.jsonl').splitlines() | map('from_json') | list }}"

    - name: Read final versioning states and mutating version commands
      ansible.builtin.set_fact:
        final_bucket_states: '{{ lookup("file", playbook_dir + "/../../../.ansible/bucket-state.json") | from_json }}'
        version_commands: '{{ bucket_commands | selectattr("0", "equalto", "version") | rejectattr("1", "equalto", "info") | list }}'

    - name: Verify new disabled buckets stay unversioned and only needed transitions run
      ansible.builtin.assert:
        that:
          - "final_bucket_states == (initial_bucket_states if ansible_check_mode else {'public': '', 'private': 'Enabled', 'default-off': '', 'enabled-off': 'Suspended', 'enabled-on': 'Enabled', 'suspended-off': 'Suspended', 'suspended-on': 'Enabled', 'empty-off': ''})"
          - "version_commands == ([] if ansible_check_mode else [['version', 'enable', 'production/private'], ['version', 'suspend', 'production/enabled-off'], ['version', 'enable', 'production/suspended-on']])"
