---
- name: Verify an unchanged cluster produces an empty dry summary
  hosts: minio_cluster
  gather_facts: false
  vars:
    ansible_os_family: RedHat
    minio_configuration_mode: dry
    minio_configuration_mc_binary_path: '{{ playbook_dir }}/fake_mc.py'
    minio_configuration_alias: production
    minio_configuration_dry_report_path: '{{ playbook_dir }}/../../../.ansible/dry-noop-report.yml'
    minio_configuration_users:
      - name: disabled
        status: disabled
    minio_configuration_backets: []
    minio_configuration_groups: []
  roles:
    - minio-configuration
  tasks:

    - name: Verify no cluster changes are planned
      ansible.builtin.assert:
        that:
          - "minio_configuration_plan == {'add': [], 'change': [], 'delete': []}"

    - name: Verify the empty plan is saved
      ansible.builtin.assert:
        that:
          - lookup('file', minio_configuration_dry_report_path) | from_yaml == minio_configuration_plan
      when: not ansible_check_mode
