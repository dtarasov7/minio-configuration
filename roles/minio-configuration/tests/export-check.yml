---
- name: Verify export and native check mode are independent
  hosts: minio_cluster
  gather_facts: false
  vars:
    ansible_os_family: RedHat
    minio_configuration_mc_binary_path: "{{ playbook_dir }}/fake_mc.py"
    minio_configuration_alias: production
    minio_configuration_export_path: "{{ playbook_dir }}/../../../.ansible/export-check-must-not-exist.yml"
    minio_configuration_users_delete: true
    minio_configuration_backets_delete: true
  pre_tasks:

    - name: Require explicit export selection and check mode
      ansible.builtin.assert:
        that:
          - ansible_check_mode
          - "'export' in ansible_run_tags"
      tags: always
  roles:
    - minio-configuration
  tasks:

    - name: Inspect output path after export check
      ansible.builtin.stat:
        path: "{{ minio_configuration_export_path }}"
      register: export_check_file
      tags: always

    - name: Verify snapshot was read and copy honored native check mode
      ansible.builtin.assert:
        that:
          - minio_configuration_effective_mode == 'export'
          - minio_configuration_plan is not defined
          - minio_configuration_snapshot_result.configuration.minio_configuration_users | length == 2
          - not export_check_file.stat.exists
          - minio_configuration_existing_users_raw is not defined or minio_configuration_existing_users_raw is skipped
          - minio_configuration_existing_buckets_raw is not defined or minio_configuration_existing_buckets_raw is skipped
      tags: always
