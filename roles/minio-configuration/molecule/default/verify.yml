---
- name: Verify MinIO configuration and bucket preservation
  hosts: minio1
  become: false
  gather_facts: false
  vars:
    minio_configuration_alias: production
    ansible_python_interpreter: /usr/bin/python3
  tasks:

    - name: verify.yaml - verify existing admin alias
      ansible.builtin.command: >-
        /usr/local/bin/mc admin info {{ minio_configuration_alias }}
      changed_when: false

    - name: verify.yaml - validate final buckets and users
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/bin/mc admin info {{ minio_configuration_alias }} >/dev/null

        /usr/local/bin/mc ls {{ minio_configuration_alias }} --json > /tmp/molecule-buckets.jsonl
        grep -q '"key":"b-test-b/"' /tmp/molecule-buckets.jsonl || {
          echo 'Expected bucket b-test-b is missing'
          cat /tmp/molecule-buckets.jsonl
          exit 1
        }
        grep -q '"key":"b-test-c/"' /tmp/molecule-buckets.jsonl || {
          echo 'Expected bucket b-test-c is missing'
          cat /tmp/molecule-buckets.jsonl
          exit 1
        }
        for bucket in b-test-a b-test-empty; do
          grep -q "\"key\":\"$bucket/\"" /tmp/molecule-buckets.jsonl || {
            echo "Undeclared bucket $bucket should be preserved"
            exit 1
          }
        done
        /usr/local/bin/mc cat {{ minio_configuration_alias }}/b-test-a/retained.txt | grep -q preserve-this-data

        /usr/local/bin/mc admin user list {{ minio_configuration_alias }} --json > /tmp/molecule-users.jsonl
        grep -q '"accessKey":"u_test_rw"' /tmp/molecule-users.jsonl || {
          echo 'Expected user u_test_rw is missing'
          cat /tmp/molecule-users.jsonl
          exit 1
        }
        grep -q '"accessKey":"u_test_ro2"' /tmp/molecule-users.jsonl || {
          echo 'Expected user u_test_ro2 is missing'
          cat /tmp/molecule-users.jsonl
          exit 1
        }
        if grep -q '"accessKey":"u_test_ro"' /tmp/molecule-users.jsonl; then
          echo 'User u_test_ro should be deleted'
          cat /tmp/molecule-users.jsonl
          exit 1
        fi

        grep -q '"accessKey":"minio_prometheus"' /tmp/molecule-users.jsonl || {
          echo 'Expected user minio_prometheus is missing'
          cat /tmp/molecule-users.jsonl
          exit 1
        }
      args:
        executable: /bin/bash
      changed_when: false

    - name: verify.yml - ensure dryrun created neither bucket nor user
      ansible.builtin.shell: |
        set -euo pipefail
        if /usr/local/bin/mc stat {{ minio_configuration_alias }}/b-dryrun-only; then
          echo 'Dryrun created a bucket'; exit 1
        fi
        if /usr/local/bin/mc admin user info {{ minio_configuration_alias }} u_dryrun_only; then
          echo 'Dryrun created a user'; exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: verify.yaml - verify rw user can write and read
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/bin/mc alias set rw http://127.0.0.1:9000 u_test_rw u_test_rw_secret_new_456 >/dev/null
        echo rw-content >/tmp/u_test_rw.txt
        /usr/local/bin/mc cp /tmp/u_test_rw.txt rw/b-test-b/rw-test.txt >/dev/null
        /usr/local/bin/mc cp rw/b-test-b/rw-test.txt /tmp/u_test_rw_read.txt >/dev/null
        grep -q 'rw-content' /tmp/u_test_rw_read.txt
      args:
        executable: /bin/bash
      changed_when: false

    - name: verify.yaml - verify readonly user cannot write
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/bin/mc alias set ro http://127.0.0.1:9000 u_test_ro2 u_test_ro2_secret_456 >/dev/null
        echo ro-content >/tmp/u_test_ro2.txt
        if /usr/local/bin/mc cp /tmp/u_test_ro2.txt ro/b-test-b/ro-test.txt >/dev/null 2>&1; then
          echo 'Readonly user unexpectedly wrote object'
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false


    - name: verify.yml - verify granular policies and presets after export replay
      ansible.builtin.shell: |
        set -euo pipefail
        mc=/usr/local/bin/mc
        "$mc" alias set scoped http://127.0.0.1:9000 u_scoped scoped_secret_123 >/dev/null
        printf 'public-content' >/tmp/scoped.txt
        "$mc" cp /tmp/scoped.txt scoped/b-test-b/public/test.txt
        "$mc" cp /tmp/scoped.txt scoped/b-test-c/public/test.txt
        "$mc" cp /tmp/scoped.txt scoped/b-test-c/single.txt
        "$mc" cat scoped/b-test-c/single.txt | grep -q public-content
        if "$mc" cp /tmp/scoped.txt scoped/b-test-c/private/test.txt; then
          echo 'Scoped user wrote outside allowed object prefixes'; exit 1
        fi
        if "$mc" mb scoped/b-forbidden; then
          echo 'Explicit Deny failed to prevent bucket creation'; exit 1
        fi
        curl --fail --silent http://127.0.0.1:9000/b-test-b/public/test.txt | grep -q public-content
        code=$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:9000/b-test-b?list-type=2')
        test "$code" = 403
        code=$(curl --silent --output /dev/null --write-out '%{http_code}' -T /tmp/scoped.txt http://127.0.0.1:9000/b-test-b/public/denied.txt)
        test "$code" = 403
        "$mc" cp /tmp/scoped.txt {{ minio_configuration_alias }}/b-download/test.txt
        curl --fail --silent http://127.0.0.1:9000/b-download/test.txt | grep -q public-content
        curl --fail --silent -T /tmp/scoped.txt http://127.0.0.1:9000/b-upload/test.txt
        code=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:9000/b-upload/test.txt)
        test "$code" = 403
      args:
        executable: /bin/bash
      changed_when: false

    - name: verify.yml - verify inherited group policy and exported membership
      ansible.builtin.shell: |
        set -euo pipefail
        /usr/local/bin/mc alias set group_reader http://127.0.0.1:9000 u_group_reader group_reader_secret_123 >/dev/null
        /usr/local/bin/mc cat group_reader/b-test-c/public/test.txt | grep -q public-content
        if /usr/local/bin/mc cp /tmp/scoped.txt group_reader/b-test-c/public/denied.txt; then
          echo 'Group reader unexpectedly wrote an object'; exit 1
        fi
        /usr/local/bin/mc admin user info {{ minio_configuration_alias }} u_group_reader --json >/tmp/group-reader-info.json
        python3 - <<'PYTEST'
        import json
        with open('/tmp/group-reader-info.json') as stream:
            info = json.load(stream)
        assert [group['name'] for group in info['memberOf']] == ['readers']
        assert not info.get('policyName')
        PYTEST
      args:
        executable: /bin/bash
      changed_when: false
