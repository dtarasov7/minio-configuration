---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: minio1
    image: redos:7.3.6
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /tmp/molecule-minio1-data1:/srv/minio/data1:rw
      - /tmp/molecule-minio1-data2:/srv/minio/data2:rw
    groups:
      - minio_cluster
  - name: minio2
    image: redos:7.3.6
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /tmp/molecule-minio2-data1:/srv/minio/data1:rw
      - /tmp/molecule-minio2-data2:/srv/minio/data2:rw
    groups:
      - minio_cluster
  - name: minio3
    image: redos:7.3.6
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /tmp/molecule-minio3-data1:/srv/minio/data1:rw
      - /tmp/molecule-minio3-data2:/srv/minio/data2:rw
    groups:
      - minio_cluster
  - name: minio4
    image: redos:7.3.6
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /tmp/molecule-minio4-data1:/srv/minio/data1:rw
      - /tmp/molecule-minio4-data2:/srv/minio/data2:rw
    groups:
      - minio_cluster

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/../.."

verifier:
  name: ansible

