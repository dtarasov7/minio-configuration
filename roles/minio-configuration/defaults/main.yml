---
minio_configuration_mode: apply
minio_configuration_dry_report_path: "{{ playbook_dir }}/minio-plan.yml"
minio_configuration_nodes_group: minio_cluster
minio_configuration_delegate_host: "{{ groups[minio_configuration_nodes_group][0] | default(inventory_hostname) }}"
minio_configuration_metrics_user: minio_prometheus
minio_configuration_alias: local
minio_configuration_mc_binary_path: /usr/local/bin/mc
minio_configuration_users_delete: false
minio_configuration_backets:
  - name: b-default
    versioning: false
minio_configuration_users:
- name: u_default_ro
  secret_key: u_default_ro_password_change_me
  groups: []
  statements:
  - Effect: Allow
    Action:
    - s3:ListBucket
    Resource:
    - arn:aws:s3:::b-default
    Sid: ListBucket
  - Effect: Allow
    Action:
    - s3:GetObject
    Resource:
    - arn:aws:s3:::b-default/*
    Sid: ReadObjects
- name: u_default_rw
  secret_key: u_default_rw_password_change_me
  groups: []
  statements:
  - Effect: Allow
    Action:
    - s3:ListBucket
    Resource:
    - arn:aws:s3:::b-default
    Sid: ListBucket
  - Effect: Allow
    Action:
    - s3:GetObject
    - s3:PutObject
    - s3:DeleteObject
    - s3:AbortMultipartUpload
    Resource:
    - arn:aws:s3:::b-default/*
    Sid: ManageObjects
minio_configuration_protected_users:
  - minioadmin
  - "{{ minio_configuration_metrics_user }}"

minio_configuration_export_path: "{{ playbook_dir }}/minio-inventory.yml"
minio_configuration_matrix_path: "{{ playbook_dir }}/minio-access-matrix.csv"
minio_configuration_no_log: true
minio_configuration_groups: []
minio_configuration_hashi_vault_path_password: ''
minio_configuration_policy_dir: /etc/minio/policies
