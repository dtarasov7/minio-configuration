---

- name: main.yaml - import pre-req tasks
  ansible.builtin.import_tasks: pre-req.yaml
  tags:
    - always

- name: main.yaml - verify existing client and alias
  ansible.builtin.import_tasks: config.yaml
  tags:
    - always
    - config

- name: main.yaml - preview planned operations
  ansible.builtin.import_tasks: dryrun.yaml
  when: minio_configuration_effective_mode == 'dryrun'
  tags:
    - always
    - dry
    - dryrun

- name: main.yaml - export current configuration
  ansible.builtin.import_tasks: export.yaml
  when: minio_configuration_effective_mode == 'export'
  tags:
    - never
    - export

- name: main.yaml - verify exclusive ownership of rule policies
  ansible.builtin.import_tasks: policy-guard.yaml
  when: minio_configuration_effective_mode == 'apply'
  tags:
    - user

- name: main.yaml - prepare policy directory
  ansible.builtin.import_tasks: install.yaml
  when: minio_configuration_effective_mode == 'apply'
  tags:
    - install
    - user
    - backet

- name: main.yaml - import backet tasks
  ansible.builtin.import_tasks: backet.yaml
  when: minio_configuration_effective_mode == "apply"
  tags:
    - backet

- name: main.yaml - import user tasks
  ansible.builtin.import_tasks: user.yaml
  when: minio_configuration_effective_mode == "apply"
  tags:
    - user

- name: main.yaml - import ssl tasks
  ansible.builtin.import_tasks: ssl.yaml
  when: minio_configuration_effective_mode == 'apply'
  tags:
    - ssl

- name: main.yaml - import clean tasks
  ansible.builtin.import_tasks: clean.yaml
  when: minio_configuration_effective_mode == "apply"
  tags:
    - never
    - clean

