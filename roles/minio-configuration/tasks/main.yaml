---

- name: main.yaml - import pre-req tasks
  ansible.builtin.import_tasks: pre-req.yaml
  tags:
    - always

- name: main.yaml - verify existing client and alias
  ansible.builtin.import_tasks: config.yaml
  tags:
    - always
    - config

- name: main.yaml - preview planned operations
  ansible.builtin.include_tasks:
    file: dryrun.yaml
    apply:
      tags:
        - always
  when: minio_configuration_mode == 'dry'
  tags:
    - always

- name: main.yaml - export current configuration
  ansible.builtin.include_tasks:
    file: export.yaml
    apply:
      tags:
        - always
  when: minio_configuration_mode == 'export'
  tags:
    - always

- name: main.yaml - verify exclusive ownership of rule policies
  ansible.builtin.include_tasks:
    file: policy-guard.yaml
    apply:
      tags:
        - user
  when: minio_configuration_mode == 'apply'
  tags:
    - user

- name: main.yaml - prepare policy directory
  ansible.builtin.include_tasks:
    file: install.yaml
    apply:
      tags:
        - install
        - user
        - backet
  when: minio_configuration_mode == 'apply'
  tags:
    - install
    - user
    - backet

- name: main.yaml - include backet tasks
  ansible.builtin.include_tasks:
    file: backet.yaml
    apply:
      tags:
        - backet
  when: minio_configuration_mode == "apply"
  tags:
    - backet

- name: main.yaml - include user tasks
  ansible.builtin.include_tasks:
    file: user.yaml
    apply:
      tags:
        - user
  when: minio_configuration_mode == "apply"
  tags:
    - user

- name: main.yaml - include ssl tasks
  ansible.builtin.include_tasks:
    file: ssl.yaml
    apply:
      tags:
        - ssl
  when: minio_configuration_mode == 'apply'
  tags:
    - ssl
