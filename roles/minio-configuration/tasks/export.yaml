---

- name: export.yaml - collect current buckets and IAM configuration
  minio_configuration_snapshot:
    binary: "{{ minio_configuration_mc_binary_path }}"
    alias: "{{ minio_configuration_alias }}"
  register: minio_configuration_snapshot_result
  run_once: true
  delegate_to: "{{ minio_configuration_delegate_host }}"

- name: export.yaml - write exported configuration variables on the controller
  ansible.builtin.copy:
    content: >-
      {{ {
           'minio_configuration_users': minio_configuration_snapshot_result.configuration.minio_configuration_users,
           'minio_configuration_groups': minio_configuration_snapshot_result.configuration.minio_configuration_groups,
           'minio_configuration_backets': minio_configuration_snapshot_result.configuration.minio_configuration_backets
         } | minio_configuration_export_yaml }}
    dest: "{{ minio_configuration_export_path }}"
    mode: '0600'
  become: false
  delegate_to: localhost
  run_once: true
