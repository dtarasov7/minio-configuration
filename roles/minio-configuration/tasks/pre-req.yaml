---

- name: pre-req.yaml - reject removed mode variable
  ansible.builtin.assert:
    that:
      - minio_configuration_mode is not defined
    fail_msg: >-
      minio_configuration_mode was removed. Remove it from inventory and extra vars;
      use --tags export, --tags dryrun or --check. A normal run applies configuration.
  run_once: true

- name: pre-req.yaml - resolve operation mode from requested tags
  ansible.builtin.set_fact:
    minio_configuration_effective_mode: >-
      {{ 'export' if 'export' in ansible_run_tags else
         ('dryrun' if ('dryrun' in ansible_run_tags or ansible_check_mode) else 'apply') }}
  run_once: true

- name: pre-req.yaml - verify supported operating system
  ansible.builtin.assert:
    that:
    - ansible_os_family in ['RedHat', 'CentOS', 'Astra Linux', 'RED', 'REDOS', 'redos', 'Altlinux', 'ALT Server']
    fail_msg: OS {{ ansible_os_family }} is not supported
    success_msg: OS family is {{ ansible_os_family }}

- name: pre-req.yaml - verify MinIO nodes group exists
  ansible.builtin.assert:
    that:
    - groups[minio_configuration_nodes_group] is defined
    - groups[minio_configuration_nodes_group] | length > 0
    fail_msg: Group {{ minio_configuration_nodes_group }} is not found or empty.
  run_once: true

- name: pre-req.yaml - build effective bucket and user configuration
  ansible.builtin.set_fact:
    minio_configuration_effective_backets: "{{ minio_configuration_backets if minio_configuration_effective_mode in ['apply', 'dryrun'] else [] }}"
    minio_configuration_effective_users: "{{ minio_configuration_users if minio_configuration_effective_mode in ['apply', 'dryrun'] else [] }}"
    minio_configuration_effective_backets_delete: '{{ minio_configuration_backets_delete | bool }}'
    minio_configuration_effective_users_delete: '{{ minio_configuration_users_delete | bool }}'
  no_log: '{{ minio_configuration_no_log }}'
  run_once: true

- name: pre-req.yaml - validate bucket definitions
  ansible.builtin.assert:
    that:
    - item.name is defined
    - item.name | length > 2
    - item.name | length <= 63
    - item.name is match('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')
    - item.name is not match('^\\d+\\.\\d+\\.\\d+\\.\\d+$')
    - '''..'' not in item.name'
    - '''-.'' not in item.name'
    - '''.-'' not in item.name'
    fail_msg: 'Each item in minio_configuration_backets must define a valid S3 bucket name: 3-63 chars, lowercase letters/digits/dot/hyphen, no underscores, and not
      an IPv4 address.'
  loop: '{{ minio_configuration_effective_backets }}'
  when: minio_configuration_effective_mode in ['apply', 'dryrun']
  run_once: true

- name: pre-req.yaml - validate user definitions
  ansible.builtin.assert:
    that:
    - item.name is defined
    - item.name is string
    - item.name | length > 0
    - item.groups is not defined or (item.groups is sequence and item.groups is not string and item.groups is not mapping)
    - item.groups | default([]) | select('string') | list | length == item.groups | default([]) | length
    - item.groups | default([]) | select('equalto', '') | list | length == 0
    - item.secret_key is not defined or (item.secret_key is string and item.secret_key | length >= 8)
    - item.status | default('enabled') in ['enabled', 'disabled']
    - item.keys() | difference(['name', 'secret_key', 'statements', 'groups', 'status']) | length == 0
    fail_msg: Use statements or groups; shared policy references and unknown user fields are not supported. New users require secret_key.
  loop: '{{ minio_configuration_effective_users }}'
  no_log: '{{ minio_configuration_no_log }}'
  when: minio_configuration_effective_mode in ['apply', 'dryrun']
  run_once: true

- name: pre-req.yaml - validate anonymous configuration
  ansible.builtin.assert:
    that:
    - item.anonymous is not defined or item.anonymous in ['none', 'private', 'download', 'upload', 'public']
    - item.anonymous_policy is not defined or item.anonymous_policy is mapping
    - item.anonymous is not defined or item.anonymous_policy is not defined
    fail_msg: Use either anonymous preset or anonymous_policy IAM document.
  loop: '{{ minio_configuration_effective_backets }}'
  when: minio_configuration_effective_mode in ['apply', 'dryrun']
  run_once: true

- name: pre-req.yaml - validate user statements
  ansible.builtin.include_tasks:
    file: validate-policy.yaml
    apply:
      tags:
        - always
  vars:
    minio_configuration_document:
      Version: '2012-10-17'
      Statement: '{{ minio_configuration_statement_user.statements }}'
    minio_configuration_require_sid: true
    minio_configuration_allow_empty_statements: true
  loop: '{{ minio_configuration_effective_users }}'
  loop_control:
    loop_var: minio_configuration_statement_user
  when:
  - minio_configuration_effective_mode in ['apply', 'dryrun']
  - minio_configuration_statement_user.statements is defined
  no_log: '{{ minio_configuration_no_log }}'
  run_once: true

- name: pre-req.yaml - validate anonymous policies
  ansible.builtin.include_tasks:
    file: validate-policy.yaml
    apply:
      tags:
        - always
  vars:
    minio_configuration_document: '{{ minio_configuration_anonymous_bucket.anonymous_policy }}'
  loop: '{{ minio_configuration_effective_backets }}'
  loop_control:
    loop_var: minio_configuration_anonymous_bucket
  when:
  - minio_configuration_effective_mode in ['apply', 'dryrun']
  - minio_configuration_anonymous_bucket.anonymous_policy is defined
  run_once: true

- name: pre-req.yaml - validate groups
  ansible.builtin.assert:
    that:
    - item.name is string
    - item.name | length > 0
    - item.keys() | difference(['name', 'members', 'statements', 'status']) | length == 0
    - item.members is not defined or (item.members is sequence and item.members is not string and item.members is not mapping)
    - item.status | default('enabled') in ['enabled', 'disabled']
  loop: "{{ minio_configuration_groups if minio_configuration_effective_mode in ['apply', 'dryrun'] else [] }}"
  when: minio_configuration_effective_mode in ['apply', 'dryrun']
  run_once: true

- name: pre-req.yaml - validate mc alias
  ansible.builtin.assert:
    that:
    - minio_configuration_alias is match('^[A-Za-z][A-Za-z0-9_-]*$')
    fail_msg: mc alias must start with a letter and contain only letters, digits, underscores or hyphens.
  run_once: true

- name: pre-req.yaml - reject group members conflicting with user memberships
  ansible.builtin.include_tasks:
    file: validate-group.yaml
    apply:
      tags:
        - always
  loop: "{{ minio_configuration_groups if minio_configuration_effective_mode in ['apply', 'dryrun'] else [] }}"
  loop_control:
    loop_var: minio_configuration_validation_group
    label: '{{ minio_configuration_validation_group.name }}'
  when: minio_configuration_effective_mode in ['apply', 'dryrun']
  run_once: true

- name: pre-req.yaml - validate group statements
  ansible.builtin.include_tasks:
    file: validate-policy.yaml
    apply:
      tags:
        - always
  vars:
    minio_configuration_document:
      Version: '2012-10-17'
      Statement: '{{ minio_configuration_statement_group.statements }}'
    minio_configuration_require_sid: true
    minio_configuration_allow_empty_statements: true
  loop: "{{ minio_configuration_groups if minio_configuration_effective_mode in ['apply', 'dryrun'] else [] }}"
  loop_control:
    loop_var: minio_configuration_statement_group
    label: '{{ minio_configuration_statement_group.name }}'
  when:
  - minio_configuration_effective_mode in ['apply', 'dryrun']
  - minio_configuration_statement_group.statements is defined
  run_once: true

- name: pre-req.yaml - require unique user and group names
  ansible.builtin.assert:
    that:
    - minio_configuration_effective_users | map(attribute='name') | list | length == minio_configuration_effective_users | map(attribute='name') | unique(case_sensitive=true) | list |
      length
    - minio_configuration_groups | map(attribute='name') | list | length == minio_configuration_groups | map(attribute='name') | unique(case_sensitive=true) | list | length
    fail_msg: User names must be unique, and group names must be unique.
  when: minio_configuration_effective_mode in ['apply', 'dryrun']
  run_once: true

- name: pre-req.yaml - reject shared named policy configuration
  ansible.builtin.assert:
    that:
      - minio_configuration_policies is not defined
    fail_msg: 'Use owner statements; shared named policies are not supported.'
  when: minio_configuration_effective_mode in ['apply', 'dryrun']
  run_once: true

- name: pre-req.yaml - validate Sid uniqueness and prepare exclusive rule policies
  ansible.builtin.set_fact:
    minio_configuration_rule_policies: "{{ minio_configuration_effective_users | minio_configuration_policy_definitions(minio_configuration_groups) }}"
  when: minio_configuration_effective_mode in ['apply', 'dryrun']
  run_once: true
