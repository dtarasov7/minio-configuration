---
- name: install.yaml - create policy directory
  ansible.builtin.file:
    path: "{{ minio_configuration_policy_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: >-
    'install' in ansible_run_tags or
    minio_configuration_rule_policies | default([]) | length > 0 or
    minio_configuration_effective_backets | selectattr('anonymous_policy', 'defined') | list | length > 0
  run_once: true
  delegate_to: "{{ minio_configuration_delegate_host }}"

