---
- name: config.yaml - verify existing mc alias and MinIO admin API access
  ansible.builtin.command:
    argv:
      - "{{ minio_configuration_mc_binary_path }}"
      - admin
      - info
      - "{{ minio_configuration_alias }}"
  register: minio_configuration_admin_info
  changed_when: false
  check_mode: false
  run_once: true
  delegate_to: "{{ minio_configuration_delegate_host }}"
