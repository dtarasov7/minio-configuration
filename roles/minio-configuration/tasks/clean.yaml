---
- name: clean.yaml - remove managed users except protected
  ansible.builtin.command:
    argv:
    - '{{ minio_configuration_mc_binary_path }}'
    - admin
    - user
    - remove
    - '{{ minio_configuration_alias }}'
    - '{{ item.name }}'
  loop: '{{ minio_configuration_users }}'
  loop_control:
    label: '{{ item.name }}'
  when: item.name not in (minio_configuration_protected_users | list)
  failed_when: false
  run_once: true
  delegate_to: '{{ minio_configuration_delegate_host }}'
- name: clean.yaml - remove managed buckets
  ansible.builtin.command:
    cmd: '{{ minio_configuration_mc_binary_path }} rb --force {{ minio_configuration_alias }}/{{ item.name }}'
  loop: '{{ minio_configuration_backets }}'
  loop_control:
    label: '{{ item.name }}'
  failed_when: false
  run_once: true
  delegate_to: '{{ minio_configuration_delegate_host }}'
- name: clean.yaml - remove generated anonymous policy files
  ansible.builtin.file:
    path: '{{ minio_configuration_policy_dir }}/anonymous-{{ item.name }}.json'
    state: absent
  loop: '{{ minio_configuration_backets }}'
  run_once: true
  delegate_to: '{{ minio_configuration_delegate_host }}'
- name: clean.yaml - remove generated rule policy files
  ansible.builtin.file:
    path: '{{ minio_configuration_policy_dir }}/{{ item.name | hash(''sha256'') }}.json'
    state: absent
  loop: '{{ minio_configuration_users | minio_configuration_policy_definitions(minio_configuration_groups) }}'
  loop_control:
    label: '{{ item.name }}'
  run_once: true
  delegate_to: '{{ minio_configuration_delegate_host }}'
- name: clean.yaml - finish play after cleanup
  ansible.builtin.meta: end_play
